<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lo que sigue — de verdad</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f3ed;color:#4d4a46;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}.page{width:100%;max-width:720px;padding:40px 24px}.initials{font-size:18px;letter-spacing:.45em;margin-bottom:34px}.kicker,.next{font-size:13px;letter-spacing:.25em}.kicker{margin-bottom:14px}h1{font-size:clamp(34px,9vw,68px);letter-spacing:.08em;font-weight:400;margin:0 0 12px}.subtitle{font-size:17px;font-style:italic;margin-bottom:42px}.next{margin-bottom:12px}.date{font-size:17px;letter-spacing:.14em;margin-bottom:34px}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 auto 42px}.unit{padding:18px 5px;border-top:1px solid #aaa39a;border-bottom:1px solid #aaa39a}.number{font-size:clamp(28px,7vw,48px);font-weight:300}.label{font-size:10px;letter-spacing:.18em;margin-top:6px}.footer{font-size:14px;letter-spacing:.12em}.done{font-size:24px;letter-spacing:.18em;line-height:1.6}@media(max-width:480px){.countdown{gap:6px}.unit{padding:14px 2px}.date{font-size:14px}}</style></head><body><div class="page"><div class="initials">A · A</div><div class="kicker">LO QUE SIGUE — DE VERDAD</div><h1>TENERIFE</h1><div class="subtitle">Y esto acaba de empezar…</div><div class="next">PRÓXIMA PARADA: TENERIFE</div><div class="date">22 · SEPTIEMBRE · 2026 · 22:45</div><div id="countdown" class="countdown"><div class="unit"><div id="days" class="number">--</div><div class="label">DÍAS</div></div><div class="unit"><div id="hours" class="number">--</div><div class="label">HORAS</div></div><div class="unit"><div id="minutes" class="number">--</div><div class="label">MINUTOS</div></div><div class="unit"><div id="seconds" class="number">--</div><div class="label">SEGUNDOS</div></div></div><div id="done" class="done" style="display:none">YA ESTÁ. ❤️<br><span style="font-size:14px;letter-spacing:.22em">PRÓXIMA PARADA: TENERIFE</span></div><div class="footer">Hasta volver a encontrarnos. ❤️</div></div><script>const target=new Date("2026-09-22T22:45:00+01:00").getTime();function update(){let diff=target-Date.now();if(diff<=0){document.getElementById("countdown").style.display="none";document.querySelector(".footer").style.display="none";document.getElementById("done").style.display="block";return}const d=Math.floor(diff/86400000);diff%=86400000;const h=Math.floor(diff/3600000);diff%=3600000;const m=Math.floor(diff/60000);diff%=60000;const s=Math.floor(diff/1000);document.getElementById("days").textContent=d;document.getElementById("hours").textContent=String(h).padStart(2,"0");document.getElementById("minutes").textContent=String(m).padStart(2,"0");document.getElementById("seconds").textContent=String(s).padStart(2,"0")}update();setInterval(update,1000);</script></body></html>
